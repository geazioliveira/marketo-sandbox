# The quality check on every pull request and on main (#3).
#
# One job, so the required check keeps its name (`Qualidade / check`, pinned in
# scripts/loop-sections.mjs as requiredChecks). `npm run check` is what a
# person runs before the PR: lint, format:check, typecheck, unit tests,
# check:context and the build, in that order. The e2e is a step of its own,
# because it boots the app. It needs no environment of its own: since #9 the
# app sends no telemetry.
#
# Still left out: check:all, and with it Python. The generators still write to
# the old layout, so it cannot pass today (#7).
name: Qualidade

on:
  # A feature branch is covered by its pull request; push runs only on main, so
  # the same commit is not billed twice.
  push:
    branches: [main]
  pull_request:
  # Re-run main without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

# On a pull request or a branch, a new push supersedes the stale run. On main,
# no run is ever cancelled or replaced: every commit on main needs a verdict,
# and a cancelled run is neither pass nor fail. cancel-in-progress alone is not
# enough there, because a group keeps one pending run and a third push would
# replace the second push's waiting run. So each commit of main gets a group
# of its own, its SHA; only two runs of that same commit (a push and a manual
# re-run) ever share one, and the later waits for the earlier.
concurrency:
  group: check-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: e2e
        run: npm run test:e2e
      # A step that rewrote a tracked file, or left a file that is not ignored,
      # passes on its own. `git diff` sees only tracked files, so read the status.
      - name: Árvore limpa
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "Os checks deixaram a árvore suja:"
            echo "$status"
            exit 1
          fi

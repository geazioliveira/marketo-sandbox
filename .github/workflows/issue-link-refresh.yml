# Keeps the issue-link check fresh (#3): when an issue changes, re-run the
# issue-link of every open PR that closes it; on demand, re-run one PR's.
# scripts/refresh-issue-link.mjs does the work.
#
# Why: issue-link.yml runs on pull_request_target, and events on the issue do
# not trigger it. A withdrawn Approve, a new `# Plano`, a moved label, a
# closing or a reopening used to leave a green check with a stale verdict.
# Issue events always run the workflow from the default branch, so this file
# and the script come from main, as the gate does. A
# workflow_dispatch runs the copy of the ref it was dispatched on: the command
# the docs give dispatches on main (`--ref main`, refreshPrCommand), and the
# job below skips a dispatch on any other ref.
#
# Reviews renew nothing here since #30: issue-link.yml runs the gate with
# --review-report, so the Copilot review on the head and the open review
# threads are only reported there, with a warning on the PR. The review
# signal (review-signal.yml) and the workflow_run trigger that answered it
# were removed. A dispatch with `-f pr=<n>` re-runs one PR's check:
# `gh workflow run issue-link-refresh.yml --ref main -f pr=<n>`. That command
# returns before the refresh runs, and a failed refresh shows nothing on the
# PR: alone, it is no fresh verdict.
#
# Only a pull_request_target run is re-run: that is the one that takes
# issue-link.yml from main, not from the PR. A run still in progress cannot be
# re-run: the script polls it until it finishes and then re-runs it, and goes
# red if it is still going after four minutes, inside the job's five.
#
# The only write is actions: write, for the re-run. A re-run asked for with
# GITHUB_TOKEN goes through (measured live on runs 36263677912 and
# 36269762597). The rule before a merge stands all the same: renew the
# verdict with the gate in CI mode at the PR's head, which judges the review
# and the threads, and merge only on its exit 0
# (docs/development/workflow.md#pull-requests-e-merge).
name: Atualiza vínculo com issue

on:
  issues:
    types: [labeled, unlabeled, edited, closed, reopened]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: Número da PR cujo issue-link é re-rodado
        required: true
        type: number

permissions:
  actions: write
  issues: read
  pull-requests: read
  contents: read

# One refresh per issue, and one per PR, at a time. A newer event waits and
# replaces an older waiting one, which is right here: the last state of the
# issue or the PR is what the re-run must read. Issues and PRs share their
# numbers, so the two kinds are kept apart: a comment on PR #N is an
# issue_comment event of #N, skipped below, and in the same group it would
# replace a waiting refresh of PR #N.
concurrency:
  group: issue-link-refresh-${{ github.event.issue && 'issue' || 'pr' }}-${{ github.event.issue.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh
    # A comment on a pull request is an issue_comment event too, and nothing
    # on a PR's conversation changes the gate's verdict: skip it here, so it
    # costs no runner minutes. The script refuses it again (IS_PR). A dispatch
    # runs only from main: this catches accidents only, since the dispatched ref's
    # own copy of this file can drop the guard.
    if: ${{ !github.event.issue.pull_request && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only the scripts; cone mode also keeps the root files, so .nvmrc
      # comes along.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      # Nothing is installed: the script uses only Node's own modules.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Event data reaches the script only through env, never interpolated
      # into the shell. The script picks its mode by GITHUB_EVENT_NAME, which
      # the runner sets: an issue event reads ISSUE_NUMBER and IS_PR, and a
      # dispatch reads PR_NUMBER.
      - name: Re-roda o issue-link das PRs abertas
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
          PR_NUMBER: ${{ inputs.pr }}
        run: node scripts/refresh-issue-link.mjs

# Issue form for a feature (category label `enhancement`).
#
# Each required textarea label is a heading of `featureSections` in
# scripts/loop-sections.mjs, word for word and in order: GitHub writes every
# answer under `### <label>`, and the gate looks for exactly those headings.
# test/scripts/forms-parity.spec.ts holds the two equal.
#
# A form carries a full plan, so the issue opens waiting for the owner: the
# category label plus `ready-for-human`, never `needs-triage` (a report without
# a plan) and never `ready-for-agent` (only the owner applies it, after the
# Approve). docs/development/workflow.md gives the label rules.
#
# GitHub enforces `validations.required` only in public repositories. In this
# private repository a blank field is still submitted, as `_No response_`, and
# the gate's `sections` step refuses it. The flag stays so the form shows which
# fields the plan needs.
name: Funcionalidade
description: Plano de uma mudança nova, com contexto, estado atual, critérios de aceite, plano, riscos e perguntas para o Approve.
labels: [enhancement, ready-for-human]
body:
  - type: markdown
    attributes:
      value: |
        **Como esta issue vira trabalho**

        - O plano vive aqui. Preencha todos os campos obrigatórios: o gate recusa campo vazio, mesmo quando o formulário deixa enviar.
        - A issue abre com `ready-for-human`. O dono aprova com um comentário cuja primeira linha é exatamente `# Owner Approve`, seguida das palavras dele, e só depois desse comentário move a label de `ready-for-human` para `ready-for-agent`. Só o dono faz as duas coisas.
        - Depois do Approve, não edite o corpo nem nenhum comentário, anterior ou posterior a ele (só o próprio Approve pode ser editado), e não apague comentários: qualquer um desses revoga o Approve. Uma revisão vai num comentário novo cuja primeira linha é exatamente `# Plano`, com o plano inteiro; respostas vão em comentários novos.
        - Um comentário que não quer mexer no Approve não abre com um título que fale de approve: heading de `#` a `######`, título sublinhado com `===` ou `---`, linha inteira em negrito, ou qualquer um deles citado com `>`. Depois de um Approve, um título desses o cancela. Uma frase comum que menciona approve, ou uma referência como `#5`, não muda nada.
        - Os critérios de aceite são marcados em `context/intent/`, nunca aqui: marcar um checkbox edita o corpo.
        - Dentro de um campo, use subtítulos `####` ou menores. O GitHub já usa `###` para o título de cada campo.
  - type: textarea
    id: contexto
    attributes:
      label: Contexto e porquê
      description: 'O problema e por que resolvê-lo agora.'
      placeholder: |
        Qual problema isto resolve, para quem, e por que agora.
        Se vier de um pedido do dono ou de outra issue, cite.
    validations:
      required: true
  - type: textarea
    id: estado-atual
    attributes:
      label: Estado atual
      description: 'Citações medidas do código (arquivo:linha, SHA), inclusive o que contradiz o plano.'
      placeholder: |
        - `src/modulo/arquivo.ts:42` em abc1234: o que o código faz hoje.
        - O que foi medido, e como (comando e saída).
        - O que contradiz o plano, se houver.
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceite
      description: 'Itens de checklist verificáveis; marcados só em context/intent, nunca no corpo. Um item por linha, cada um começando com `- [ ]` seguido do texto.'
      value: '- [ ] '
    validations:
      required: true
  - type: textarea
    id: plano
    attributes:
      label: Plano
      description: 'Os commits em ordem e o nome exato da branch. O gate procura esse nome, exatamente assim, dentro desta seção.'
      placeholder: |
        Commits em ordem e o nome exato da branch: feature/<número>-<slug> (o número é o desta issue).

        Branch: feature/<número>-<slug>
        1. Intent: só context/intent/.
        2. O que será construído, um commit por passo.
        3. Learn: Resultados no intent e entrada no changelog.
    validations:
      required: true
  - type: textarea
    id: riscos
    attributes:
      label: Riscos
      description: 'HIGH ou NORMAL e o raciocínio, que decide a profundidade da revisão.'
      placeholder: |
        HIGH ou NORMAL, e por quê.
    validations:
      required: true
  - type: textarea
    id: perguntas
    attributes:
      label: Perguntas para o Approve
      description: 'Cada uma com recomendação, alternativa e custo. Se não houver nenhuma, escreva "Nenhuma".'
      placeholder: |
        1. A pergunta? Recomendação: ... Alternativa: ... Custo: ...
    validations:
      required: true
  - type: input
    id: issue-mae
    attributes:
      label: Issue mãe
      description: 'A issue que acompanha esta, se houver.'
      placeholder: '#1'
    validations:
      required: false
  - type: textarea
    id: bloqueada-por
    attributes:
      label: Bloqueada por
      description: 'Issues que precisam fechar antes de esta começar, se houver.'
      placeholder: |
        - #N: por quê.
    validations:
      required: false
  - type: textarea
    id: fora-de-escopo
    attributes:
      label: Fora de escopo
      description: 'O que esta issue não faz, e onde isso será feito.'
      placeholder: |
        - O que fica de fora (#N, se já houver issue).
    validations:
      required: false
